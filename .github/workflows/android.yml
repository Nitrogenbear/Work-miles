name: Build app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests (tax year, HMRC rates, distance, CSV)
        run: ./gradlew -p core test

      - name: Check signing password
        id: signing
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          PW="$(printf '%s' "$SIGNING_PASSWORD" | tr -d '[:space:]')"
          if [ -n "$PW" ] && keytool -list -keystore signing/mhe-miles.p12 -storetype PKCS12 -storepass "$PW" | grep -q PrivateKeyEntry; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Signing key unlocked."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SIGNING_PASSWORD is missing or doesn't unlock signing/mhe-miles.p12. This APK is signed with a temporary key, so it can't be installed over an existing copy without uninstalling first."
          fi

      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ steps.signing.outputs.ok == 'true' && secrets.SIGNING_PASSWORD || '' }}
        run: ./gradlew :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: MHE-Miles-apk
          path: app/build/outputs/apk/release/*.apk
