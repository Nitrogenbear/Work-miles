name: Build app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests (tax year, HMRC rates, distance, CSV)
        run: ./gradlew -p core test

      - name: Check signing password
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Add the SIGNING_PASSWORD secret (Settings > Secrets and variables > Actions). Without it each build gets a different signature and phones refuse to install updates."
            exit 1
          fi
          PW="$(printf '%s' "$SIGNING_PASSWORD" | tr -d '[:space:]')"
          # A fingerprint (not the password) to check the secret was entered correctly.
          echo "Password length ${#PW}, fingerprint $(printf '%s' "$PW" | sha256sum | cut -c1-12)"
          keytool -list -keystore signing/mhe-miles.p12 -storetype PKCS12 -storepass "$PW" | grep -q PrivateKeyEntry \
            || { echo "::error::The SIGNING_PASSWORD secret doesn't unlock the signing key. Re-enter it."; exit 1; }

      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: MHE-Miles-apk
          path: app/build/outputs/apk/release/*.apk
